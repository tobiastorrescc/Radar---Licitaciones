name: Auditoría de cobertura aislada
on:
  push:
    branches: [mejora/radar-auditable]
    paths: [tools/plan_cobertura.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: auditoria-cobertura-aislada
  cancel-in-progress: false
jobs:
  investigar:
    if: github.ref == 'refs/heads/mejora/radar-auditable'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Leer lote de investigación explícito
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('tools/plan_cobertura.json'))
          for k in ('sondear','auditar','descubrir'):print(k+'='+str(d.get(k,False)).lower())
          run=str(d.get('reprocesar_run',''))
          if run and not run.isdigit():raise ValueError('Run inválido')
          print('reprocesar_run='+run)
          pagos=str(d.get('pagos_run',''))
          if pagos and not pagos.isdigit():raise ValueError('Run de pagos inválido')
          print('pagos_run='+pagos)
          PY
      - name: Preparar lectura documental
        timeout-minutes: 4
        run: bash tools/preparar_documentos.sh
      - uses: actions/cache@v4
        with:
          path: work/cache-documentos
          key: textos-v1-cobertura-${{ github.run_id }}
          restore-keys: textos-v1-
      - name: Sondear enlaces oficiales con evidencia y tiempo acotado
        if: steps.plan.outputs.sondear == 'true'
        run: python -u tools/sondear_cobertura.py
      - name: Restaurar copia independiente del último respaldo diario
        if: steps.plan.outputs.auditar == 'true'
        run: |
          python tools/respaldo_piloto.py restaurar --salida work/cobertura --respaldo piloto_respaldo/diario
          python tools/respaldo_piloto.py antes --salida work/cobertura --respaldo piloto_respaldo/diario
          python tools/auditar_evolucion.py antes --salida work/cobertura
      - name: Auditoría real aislada sin modificar el respaldo diario
        if: steps.plan.outputs.auditar == 'true'
        run: python -u tools/radar_controlado.py --salida work/cobertura --total 600 --documentos 180
      - name: Verificar continuidad y restauración del nuevo estado aislado
        if: steps.plan.outputs.auditar == 'true'
        run: |
          python tools/respaldo_piloto.py despues --salida work/cobertura --respaldo piloto_respaldo/diario
          python tools/auditar_evolucion.py despues --salida work/cobertura
          python tools/respaldo_piloto.py exportar --salida work/cobertura --respaldo work/cobertura-respaldo
      - name: Reverificar sólo el lote explícito de conectores corregidos
        run: python -u tools/reverificar_lote.py
      - name: Validar origen de la auditoría que se reinterpreta
        if: steps.plan.outputs.reprocesar_run != ''
        uses: actions/github-script@v7
        env:
          AUDITORIA_RUN: ${{ steps.plan.outputs.reprocesar_run }}
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.AUDITORIA_RUN)});
            if(r.conclusion!=='success'||r.head_branch!=='mejora/radar-auditable'||r.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||r.path!=='.github/workflows/mejorar-cobertura.yml')throw Error('Auditoría de origen inválida');
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.reprocesar_run != ''
        with:
          name: cobertura-${{ steps.plan.outputs.reprocesar_run }}
          path: work/reprocesar
          run-id: ${{ steps.plan.outputs.reprocesar_run }}
          github-token: ${{ github.token }}
      - name: Reprocesar citas de pliegos reales sin repetir descargas ni modificar el estado
        if: steps.plan.outputs.reprocesar_run != ''
        run: python tools/reprocesar_auditoria.py
      - name: Archivar respaldo auditado separado del diario y comprobar restauración
        if: steps.plan.outputs.reprocesar_run != ''
        run: |
          test "${{ github.ref }}" = 'refs/heads/mejora/radar-auditable'
          mkdir -p piloto_respaldo/auditorias/2026-10-29
          cp work/reprocesar/work/cobertura-respaldo/*.json.gz work/reprocesar/work/cobertura-respaldo/indice.json piloto_respaldo/auditorias/2026-10-29/
          python tools/respaldo_piloto.py restaurar --salida work/comprobar-archivo --respaldo piloto_respaldo/auditorias/2026-10-29
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- piloto_respaldo/auditorias/2026-10-29
          if ! git diff --cached --quiet; then
            git commit -m 'Archivar auditoría ampliada sin modificar el historial diario [skip ci]'
            git pull --rebase origin mejora/radar-auditable
            git push origin HEAD:mejora/radar-auditable
          fi
      - name: Validar origen de la copia para revisión de pagos de abiertas
        id: pagos_origen
        if: steps.plan.outputs.pagos_run != ''
        uses: actions/github-script@v7
        env:
          PAGOS_RUN: ${{ steps.plan.outputs.pagos_run }}
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.PAGOS_RUN)});
            if(r.conclusion!=='success'||r.head_branch!=='mejora/radar-auditable'||r.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||!['.github/workflows/mejorar-cobertura.yml','.github/workflows/programar-piloto.yml'].includes(r.path))throw Error('Auditoría documental de origen inválida');
            core.setOutput('artefacto',r.path==='.github/workflows/programar-piloto.yml'?'radar-controlado':`cobertura-${r.id}`);
            core.setOutput('entrada',r.path==='.github/workflows/programar-piloto.yml'?'work/revision-pagos':'work/revision-pagos/work/cobertura');
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.pagos_run != ''
        with:
          name: ${{ steps.pagos_origen.outputs.artefacto }}
          path: work/revision-pagos
          run-id: ${{ steps.plan.outputs.pagos_run }}
          github-token: ${{ github.token }}
      - name: Revisar sólo pliegos de abiertas con caché y OCR selectivo
        if: steps.plan.outputs.pagos_run != ''
        timeout-minutes: 6
        run: python -u tools/auditar_pagos_abiertas.py --entrada "${{ steps.pagos_origen.outputs.entrada }}" --ocr-paginas 10
      - name: Revisar candidatas sin publicar automáticamente cambios de inventario
        if: steps.plan.outputs.descubrir == 'true'
        run: python -u tools/descubrir_fuentes.py --salida work/descubrimiento --total 360 --busquedas 30 --candidatos 100 --revisar-pendientes
      - name: Revisar documentos de identidades dudosas sin escribir historial
        timeout-minutes: 3
        run: python -u tools/revisar_identidades.py
      - name: Guardar evidencia incluso si el lote queda incompleto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ github.run_id }}
          path: |
            work/identidades/
            work/pagos-abiertas/
            work/sondeo/
            work/reprocesado/
            work/reverificacion/
            work/descubrimiento/
            work/cobertura/
            work/cobertura-respaldo/
            inventario/fuentes_auto.json
            inventario/descubrimiento_estado.json
          retention-days: 90
