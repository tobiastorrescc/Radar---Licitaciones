name: Fase 6 control territorial aislado y repetición
on:
  push:
    branches: [mejora/radar-auditable]
    paths: [tools/plan_fase6_cierre.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: fase6-cierre-aislado
  cancel-in-progress: false
jobs:
  comparar:
    if: github.ref == 'refs/heads/mejora/radar-auditable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias existentes sin OCR
        run: |
          python -m pip install --disable-pip-version-check --timeout 15 --retries 1 openpyxl==3.1.5 xlrd==2.0.2
          if ! command -v pdftotext; then sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=8 install -y --no-install-recommends poppler-utils; fi
      - name: Pruebas Python y Node
        run: |
          python -m unittest discover -s tests
          node tests/test_programador_github.cjs
      - name: Recuperar evidencias propias comprobando rama y workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const p=JSON.parse(fs.readFileSync('tools/plan_fase6_cierre.json'));
            for(const id of p.runs){
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:id});
              if(r.head_branch!=='mejora/radar-auditable'||r.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||!['.github/workflows/fase6-barrido.yml','.github/workflows/fase6-reparaciones.yml'].includes(r.path)||r.conclusion!=='success')throw Error('Origen o ejecución no autorizados');
              const a=(await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:id})).find(a=>a.name===`fase6-lote-${id}`);
              if(!a||a.expired||a.size_in_bytes>32000000)throw Error('Falta evidencia completa');
              const {data}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
              const d='work/fase6-cierre/capturas/'+id;fs.mkdirSync(d,{recursive:true});const z=d+'/captura.zip';fs.writeFileSync(z,Buffer.from(data));cp.execFileSync('unzip',['-q','-o',z,'-d',d]);fs.unlinkSync(z);
            }
      - name: Consultar altas registradas, Rosario y repetir en copia del historial
        run: python -u tools/fase6_cerrar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase6-cierre-${{ github.run_id }}
          path: |
            work/fase6-cierre/resultado.json
            work/fase6-cierre/auditoria.json
            work/fase6-cierre/control_rosario.json
            work/fase6-cierre/rutas.json
            work/fase6-cierre/rutas/
            work/fase6-cierre/*.csv
            work/fase6-cierre/comercial/
          retention-days: 90
