name: Fase 5 cierre comercial verificable
on:
  push:
    branches: [mejora/radar-auditable]
    paths: [tools/plan_fase5_final.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: fase5-cierre-final-aislado
  cancel-in-progress: false
jobs:
  sanear:
    if: github.ref == 'refs/heads/mejora/radar-auditable'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: descubrimiento-mejora/radar-auditable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mejora/radar-auditable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fase5_sanear_fuentes.py
      - name: Persistir sólo la corrección del catálogo de fuentes del PR
        run: |
          test "$GITHUB_REF" = 'refs/heads/mejora/radar-auditable'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventario/fuentes_auto.json inventario/descubrimiento_estado.json
          if ! git diff --cached --quiet; then
            git commit -m 'Poner en cuarentena dos altas sin evidencia de convocatoria [skip ci]'
            git pull --rebase origin mejora/radar-auditable
            git push origin HEAD:mejora/radar-auditable
          fi
  limpiar_ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const id=42628480358;
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:id});
            if(r.head_branch!=='mejora/radar-auditable'||r.path!=='.github/workflows/fase5-cierre.yml')throw Error('Ensayo ajeno');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:id});
            if(jobs.some(j=>j.name==='criticas'&&j.status==='queued'&&!j.runner_id)){
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:id});
              core.notice('Ensayo macOS sin runner cancelado; no se consultó ninguna fuente. No afecta al piloto.');
            }
  comparar:
    needs: sanear
    if: always() && github.ref == 'refs/heads/mejora/radar-auditable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: mejora/radar-auditable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de pruebas existentes, sin instalar OCR
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --timeout 15 --retries 1 openpyxl==3.1.5 xlrd==2.0.2
          if ! command -v pdftotext; then sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=8 install -y --no-install-recommends poppler-utils; fi
      - name: Pruebas Python y Node
        run: |
          python -m unittest discover -s tests
          node tests/test_programador_github.cjs
      - name: Recuperar sólo capturas comprobadas del propio repositorio y rama
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const p=JSON.parse(fs.readFileSync('tools/plan_fase5_final.json'));
            const ids=[...new Set([p.referencia,p.barrido,p.recuperacion,...p.descubrimientos])];
            for(const id of ids){
              const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:id});
              if(r.head_branch!=='mejora/radar-auditable'||r.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||!['.github/workflows/fase4-cierre.yml','.github/workflows/fase5-descubrimiento.yml','.github/workflows/fase5-expansion.yml','.github/workflows/fase5-recuperacion.yml'].includes(r.path))throw Error('Origen no autorizado');
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:id});
              for(const a of await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:id})){
                let d=null,job=null;
                if(id===p.referencia&&a.name===`fase4-comparacion-${id}`){d='referencia';job=jobs.find(j=>j.name==='comparar');}
                else if(id===p.barrido&&/^fase5-barrido-\d+-[0-3]$/.test(a.name)){d='barrido';job=jobs.find(j=>j.name===`barrer (${a.name.slice(-1)})`);}
                else if(p.descubrimientos.includes(id)&&a.name===`fase5-descubrimiento-${id}`){d=`descubrimiento/${id}`;job=jobs.find(j=>j.name==='descubrir');}
                if(id===p.recuperacion&&a.name===`fase5-recuperacion-${id}`){d='recuperacion';job=jobs.find(j=>j.name==='revisar');}
                if(!d)continue;
                if(!job||job.conclusion!=='success')throw Error('Tarea de captura incompleta: '+a.name);
                if(a.size_in_bytes>32000000)throw Error('Excede presupuesto de artefacto');
                const {data}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
                d='work/fase5-cierre/'+d;fs.mkdirSync(d,{recursive:true});const z=d+'/'+a.id+'.zip';fs.writeFileSync(z,Buffer.from(data));cp.execFileSync('unzip',['-q','-o',z,'-d',d]);fs.unlinkSync(z);
              }
            }
      - name: Medir novedades frente a Fase 4 y repetir sin red ni OCR
        env:
          FASE5_CIERRE_PLAN: tools/plan_fase5_final.json
        run: python -u tools/fase5_cerrar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase5-comparacion-${{ github.run_id }}
          path: |
            work/fase5-cierre/resultado.json
            work/fase5-cierre/control_rosario.json
            work/fase5-cierre/nuevas_verificadas.json
            work/fase5-cierre/candidatas_revisadas.json
            work/fase5-cierre/*.csv
            work/fase5-cierre/cobertura_territorial_resumen.json
            work/fase5-cierre/comercial/
            work/fase5-cierre/descubrimiento_diario/
          retention-days: 90
