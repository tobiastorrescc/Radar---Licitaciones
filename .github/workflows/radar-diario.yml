name: Radar diario de licitaciones
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # 08:00 Argentina; GitHub puede retrasar la ejecucion
  pull_request:
  push:
    paths: ['radar.py', 'conectores.py', 'extractores.py', 'documentos.py', 'oportunidades.py', 'inventario/**', 'tools/**', 'tests/**', '.github/workflows/**', 'fuentes*']
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - run: python -m unittest discover -s tests -v
  ejecutar-radar:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - uses: actions/cache@v4
        with:
          path: work/cache-documentos
          key: textos-v1-${{ github.run_id }}
          restore-keys: textos-v1-
      - name: Ejecutar radar
        id: radar
        continue-on-error: true
        run: python radar.py
      - name: Guardar resultados y errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_id }}
          path: |
            radar_estado.json
            licitaciones_nuevas.json
            auditoria_fuentes.json
            radar.log
            licitaciones_nuevas.md
          retention-days: 90
      - name: Persistir historial incluso ante fallos parciales
        if: always() && steps.radar.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar_estado.json licitaciones_nuevas.json licitaciones_nuevas.md auditoria_fuentes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar historial de licitaciones [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reportar fallos de consulta
        if: steps.radar.outcome == 'failure'
        run: exit 1

  verificar-fuentes-rama:
    if: (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - uses: actions/cache@v4
        with:
          path: work/cache-documentos
          key: textos-v1-${{ github.run_id }}
          restore-keys: textos-v1-
      - name: Recuperar auditoría de partida #54
        uses: actions/download-artifact@v4
        with:
          name: verificacion-fuentes-40425270465
          run-id: 40425270465
          github-token: ${{ github.token }}
          path: work/base54
      - name: Revisar las 11 abiertas de la auditoría #54
        run: python -u tools/revisar_abiertas.py
      - name: Verificar sin modificar historial de producción
        id: verificar
        continue-on-error: true # Diagnóstico de fuentes; no confundir disponibilidad con pruebas unitarias.
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u tools/verificar_fuentes.py --salida work/verificacion/verificacion.json --concurrencia 4 --conexion 5 --lectura 10 --por-fuente 60 --total 600
      - name: Normalizar y reportar oportunidades sin escribir producción
        if: always()
        run: python tools/reportar_oportunidades.py
      - name: Resumen de fuentes en Actions
        if: always()
        run: |
          python - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('work/verificacion/verificacion.json')
          r = json.loads(p.read_text())
          if r.get('schema_version') != 2:
              raise SystemExit('No hay un informe actual del verificador')
          if r['estado_ejecucion'] != 'COMPLETADA' or r['resumen']['finalizadas'] != r['resumen']['configuradas'] or r['resumen']['fuentes_error_interno']:
              raise SystemExit('Verificación incompleta o fallo interno; revisar auditoría y parciales')
          print('### Verificación de fuentes: ' + r['estado_ejecucion'])
          print('La disponibilidad de portales es un diagnóstico separado de las pruebas automáticas.')
          for k, v in r['resumen'].items():
              print(f'- {k}: {v}')
          PYCODE
      - name: Guardar evidencia de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-fuentes-${{ github.run_id }}
          path: work/verificacion/
          if-no-files-found: error
          retention-days: 90
