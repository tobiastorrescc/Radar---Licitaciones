name: Fase 7 auditoría de rama y descubrimiento aislado
on:
  push:
    branches: [mejora/radar-auditable]
    paths: [tools/plan_fase7.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: fase7-aislado
  cancel-in-progress: false
jobs:
  ejecutar:
    if: github.ref == 'refs/heads/mejora/radar-auditable'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias existentes sin OCR
        run: |
          python -m pip install --disable-pip-version-check --timeout 15 --retries 1 openpyxl==3.1.5 xlrd==2.0.2
          if ! command -v pdftotext; then sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=8 install -y --no-install-recommends poppler-utils; fi
      - uses: actions/cache@v4
        with:
          path: work/cache-documentos
          key: fase7-documentos-${{ github.run_id }}
          restore-keys: |
            fase7-documentos-
            fase6-documentos-
            textos-v1-
      - name: Pruebas Python y Node
        run: |
          python -m unittest discover -s tests
          node tests/test_programador_github.cjs
      - name: Rosario, cambio de estado y recorrido con reintento acotado
        run: python -u tools/fase7_rosario.py
      - name: Siete localidades incompletas, exploración rápida y validación profunda
        run: |
          if python -c 'import json,sys;sys.exit(json.load(open("tools/plan_fase7.json"))["fase"]!="continuacion")'; then
            python -u tools/fase7_continuar.py
          else
            if python -c 'import json,sys;sys.exit(json.load(open("tools/plan_fase7.json"))["fase"]!="validacion_final")'; then
              python -u tools/fase7_final.py
              python -u tools/descubrir_fuentes.py --salida work/fase7/preflight-periodico --total 60 --busquedas 1 --candidatos 2 --revisar-pendientes
            else
              python -u tools/fase7_barrido.py
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase7-${{ github.run_id }}
          path: work/fase7/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase7-inventario-${{ github.run_id }}
          path: |
            inventario/fase7_estado.json
            inventario/fuentes_auto.json
          retention-days: 90
